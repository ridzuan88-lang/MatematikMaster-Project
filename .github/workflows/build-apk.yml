name: Build Matematik Master APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" || true

      - name: Set up Gradle 8.7 (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate Gradle configuration
        run: |
          gradle --version
          gradle projects --stacktrace

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Show build errors (only on failure)
        if: failure()
        run: |
          {
            echo '### Ralat build (salin teks ini)'
            echo '```'
            grep -E "^e: |FAILED|What went wrong|Execution failed|error:" -A6 build.log | head -150 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload build log (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Verify debug APK output path
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Matematik-Master-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release keystore (only if secrets exist)
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Keystore tersedia - release APK akan dibina."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Tiada keystore secret - langkau release APK (debug APK masih dibina)."
          fi

      - name: Build release APK
        if: steps.ks.outputs.available == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        if: steps.ks.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Matematik-Master-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
